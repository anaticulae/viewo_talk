[project]
name = "viewo_talk"
version = "1.0.0"
description = ""
requires-python = ">=3.12"
authors = [
    { name = "Helmut Konrad Schewe", email = "helmutus@outlook.com" },
]
dependencies = [
    "flask-bootstrap>=3.3.7.1,<4.0.0.0",
    "flask>=3.1.3,<4.0.0",
    "utilo>=2.112.1,<3.0.0",
    "viewo_api>=1.0.1,<2.0.0",
]
keywords = []
classifiers = [
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
license = "MIT"
license-files = [
    "LICENSE",
]

[project.readme]
file = "README"
content-type = "text/markdown"

[project.optional-dependencies]
dev = [
    "selenium>=4.51.0,<5.0.0",
    "utilotest>=1.1.1,<2.0.0",
]

[project.urls]
Homepage = "https://github.com/anaticulae/viewo_talk"
Repository = "https://github.com/anaticulae/viewo_talk"

[project.scripts]
viewo_talk = "viewo_talk.cli:main"

[build-system]
requires = [
    "setuptools>=82.0.1",
    "wheel>=0.46.3",
]
build-backend = "setuptools.build_meta"

[tool.semantic_release]
version_toml = [
    "pyproject.toml:project.version",
]

[tool.semantic_release.changelog]
mode = "init"
output_format = "md"

[tool.semantic_release.changelog.default_templates]
changelog_file = "CHANGELOG"

[tool.semantic_release.commit_parser_options]
patch_tags = [
    "fix",
    "perf",
    "build",
    "chore",
    "ci",
    "docs",
    "style",
    "refactor",
    "test",
    "deps",
]

[tool.setuptools.packages.find]
where = [
    ".",
]
include = [
    "viewo_talk",
    "viewo_talk.api",
    "viewo_talk.plan",
]
exclude = [
    "tests/*",
]
